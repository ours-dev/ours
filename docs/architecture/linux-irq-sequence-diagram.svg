<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1230" viewBox="0 0 1800 1230">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#64748b}.h{font-size:16px;font-weight:700}.p{font-size:14px;fill:#334155}.sm{font-size:13px;fill:#475569}.note{font-size:14px;fill:#1e3a8a;font-weight:700}</style>
  </defs>
  <rect width="1800" height="1230" fill="#F8FAFC"/>
  <text x="70" y="65" class="t title">Linux IRQ 框架 · 时序图</text>
  <text x="70" y="96" class="t sub">示例：GPIO7 触发，经 GPIO 控制器级联到 GIC，再由 Linux 分发给具体设备驱动。</text>

  <!-- headers -->
  <g>
    <rect x="75" y="135" width="170" height="58" rx="13" fill="#DCFCE7" stroke="#4ADE80"/><text x="160" y="170" text-anchor="middle" class="t h">GPIO7 设备</text>
    <rect x="325" y="135" width="190" height="58" rx="13" fill="#DCFCE7" stroke="#4ADE80"/><text x="420" y="170" text-anchor="middle" class="t h">GPIO 控制器</text>
    <rect x="595" y="135" width="155" height="58" rx="13" fill="#DCFCE7" stroke="#4ADE80"/><text x="672" y="170" text-anchor="middle" class="t h">GIC</text>
    <rect x="830" y="135" width="190" height="58" rx="13" fill="#FFEDD5" stroke="#FB923C"/><text x="925" y="170" text-anchor="middle" class="t h">CPU 架构入口</text>
    <rect x="1100" y="135" width="190" height="58" rx="13" fill="#DBEAFE" stroke="#60A5FA"/><text x="1195" y="170" text-anchor="middle" class="t h">Generic IRQ Core</text>
    <rect x="1370" y="135" width="190" height="58" rx="13" fill="#EDE9FE" stroke="#A78BFA"/><text x="1465" y="170" text-anchor="middle" class="t h">GPIO 父级 handler</text>
    <rect x="1640" y="135" width="130" height="58" rx="13" fill="#FCE7F3" stroke="#F472B6"/><text x="1705" y="170" text-anchor="middle" class="t h">设备驱动</text>
  </g>

  <!-- lifelines -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8">
    <line x1="160" y1="193" x2="160" y2="1160"/><line x1="420" y1="193" x2="420" y2="1160"/>
    <line x1="672" y1="193" x2="672" y2="1160"/><line x1="925" y1="193" x2="925" y2="1160"/>
    <line x1="1195" y1="193" x2="1195" y2="1160"/><line x1="1465" y1="193" x2="1465" y2="1160"/>
    <line x1="1705" y1="193" x2="1705" y2="1160"/>
  </g>

  <!-- phase 1 -->
  <rect x="65" y="225" width="1710" height="95" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="90" y="254" class="t note">0. 启动时已完成配置</text>
  <text x="90" y="283" class="t p">GPIO domain：GPIO hwirq 7 → Linux virq 100　　GIC domain：GIC hwirq 40 → 父级 virq 80　　父级 virq 80 → gpio_parent_handler()</text>
  <text x="90" y="306" class="t sm">具体设备驱动已对 Linux virq 100 调用 request_irq(100, device_handler, ...)</text>

  <!-- event -->
  <text x="75" y="365" class="t h">1</text><line x1="160" y1="360" x2="410" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#g)"/>
  <text x="265" y="347" text-anchor="middle" class="t p">GPIO7 电平变化</text>
  <rect x="408" y="374" width="24" height="130" fill="#BBF7D0" opacity=".8"/>
  <text x="445" y="396" class="t p">设置 pending[7]，向父级输出中断</text>
  <text x="75" y="440" class="t h">2</text><line x1="420" y1="435" x2="662" y2="435" stroke="#475569" stroke-width="3" marker-end="url(#g)"/>
  <text x="540" y="422" text-anchor="middle" class="t p">父级中断线触发</text>
  <text x="692" y="462" class="t sm">GIC 选择 CPU，IAR 报告 hwirq = 40</text>

  <!-- CPU -->
  <text x="75" y="530" class="t h">3</text><line x1="672" y1="525" x2="915" y2="525" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="795" y="512" text-anchor="middle" class="t p">IRQ 异常 / IDT 入口</text>
  <rect x="913" y="540" width="24" height="128" fill="#FED7AA" opacity=".9"/>
  <text x="952" y="564" class="t p">保存现场；读取 GIC IAR，得到 hwirq 40</text>

  <!-- first mapping -->
  <text x="75" y="615" class="t h">4</text><line x1="925" y1="610" x2="1185" y2="610" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="1055" y="597" text-anchor="middle" class="t p">generic_handle_domain_irq(gic_domain, 40)</text>
  <rect x="1183" y="625" width="24" height="156" fill="#BFDBFE" opacity=".9"/>
  <text x="1223" y="650" class="t p">GIC domain 查表：40 → 父级 virq 80</text>
  <text x="1223" y="676" class="t p">irq_desc[80] 执行对应 flow handler</text>
  <text x="1223" y="702" class="t p">分发到 gpio_parent_handler()</text>

  <!-- parent -->
  <text x="75" y="755" class="t h">5</text><line x1="1195" y1="750" x2="1455" y2="750" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="1325" y="737" text-anchor="middle" class="t p">调用父级 IRQ handler</text>
  <rect x="1453" y="765" width="24" height="215" fill="#DDD6FE" opacity=".9"/>
  <text x="1490" y="790" class="t p">读取 GPIO pending 寄存器</text>
  <text x="1490" y="817" class="t p">发现 GPIO hwirq = 7</text>
  <text x="1490" y="846" class="t p">清除 / 确认 GPIO 控制器状态</text>

  <!-- child mapping -->
  <text x="75" y="890" class="t h">6</text><path d="M1465 885H1235V930H1205" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="1300" y="872" text-anchor="middle" class="t p">generic_handle_domain_irq(gpio_domain, 7)</text>
  <text x="950" y="928" class="t p">GPIO domain 查表：7 → Linux virq 100；进入 irq_desc[100]</text>
  <text x="75" y="968" class="t h">7</text><path d="M1195 963H1695" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#a)"/>
  <text x="1450" y="950" text-anchor="middle" class="t p">调用已注册的 device_handler(irq=100, dev_id)</text>
  <rect x="1693" y="978" width="24" height="105" fill="#FBCFE8" opacity=".9"/>
  <text x="1668" y="1102" text-anchor="end" class="t p">读取设备状态；快速确认；调度 NAPI / workqueue / IRQ 线程</text>

  <!-- completion -->
  <text x="75" y="1145" class="t h">8</text><path d="M1465 1128H925" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <text x="1195" y="1115" text-anchor="middle" class="t p">父级处理结束；架构层对 GIC EOI；CPU 恢复被中断的执行流</text>
  <text x="70" y="1200" class="t sm">重点：GIC 只报告“GPIO 控制器的父级 hwirq 40”；GPIO 控制器读取 pending 后才得到“叶子 hwirq 7”。每次 domain 查找都只发生在当前控制器的编号空间内。</text>
</svg>
