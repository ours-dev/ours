# ccache settings for every compile the build runs through the compiler cache
# (compiler_launcher, //build/toolchain/compiler_launcher.gni). Each compile
# finds this file through CCACHE_CONFIGPATH; to look at the same cache by hand,
# from the checkout root:
#
#   CCACHE_CONFIGPATH=build/ccache.conf prebuilt/ccache/ccache -s
#
# base_dir is not here: it is each checkout's own root, so the build passes it
# in CCACHE_BASEDIR.

# One cache for every worktree and every build directory, outside all of them,
# so removing a worktree does not empty it.
cache_dir = $HOME/Library/Caches/ours-ccache

# A few full builds' worth (.agents/tasks/build-cache/PLAN.md, D4).
max_size = 10G

# locale: leave LANG and the LC_* variables out of the hash. ccache hashes them
# because a compiler may translate its diagnostics, but the prebuilt clang has
# no translations, so they cannot change what a compile produces. Hashed, they
# split the cache by shell: an agent's shell has LANG=C.UTF-8 and a macOS
# terminal en_US.UTF-8, and a build from one missed every object the other had
# compiled.
sloppiness = locale
